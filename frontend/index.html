<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tender - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-card"><div class="spinner"></div><span>Working...</span></div>
  </div>
  <div class="container">
    <div class="card" style="max-width: 420px; margin: 80px auto;">
      <h2>Welcome Back</h2>
      <p class="muted">AI Tender Intelligence Platform</p>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn" onclick="login()">Login</button>
      <p class="muted">No account? <a href="register.html">Register</a></p>
      <p id="msg" class="message"></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    async function login() {
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("msg");
      msg.className = "message";
      try {
        btn.disabled = true;
        const data = await apiFetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        setToken(data.access_token);
        location.href = "dashboard.html";
      } catch (e) {
        msg.className = "message error";
        msg.innerText = "Login failed: " + apiErrorMessage(e);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
